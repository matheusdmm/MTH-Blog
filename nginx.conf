server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/security-csp.conf;

    location = /api/likes {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 2s;
        set $likes_upstream likes:3001;
        proxy_pass http://$likes_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/now-listening {
        proxy_pass https://lfm.xiffy.nl/matheusdmm;
        proxy_set_header Host lfm.xiffy.nl;
        proxy_ssl_server_name on;
        proxy_ssl_name lfm.xiffy.nl;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=120" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
